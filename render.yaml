# Render Blueprint for Renovo.
#
# Deploy this file from the repo root in Render:
#   New -> Blueprint -> connect this repo -> apply.
#
# The ideas service prompts for GEMINI_API_KEY and the image service prompts for
# HACKCLUB_AI_API_KEY during the initial Blueprint creation. Values are not stored
# in this file. The GUI receives the public API URLs below.
#
# The service names determine the onrender.com URLs. If you rename a service,
# update the matching *_API_URL value on renovo-ai-web.

services:
  # Node ideas API (tools, prices, stores and steps).
  - type: web
    name: renovo-ai-ideas
    runtime: node
    plan: free
    branch: main
    rootDir: gemini-ideas
    buildCommand: bun install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: GEMINI_API_KEY
        sync: false

  # Python image-edit API (FastAPI + Pillow + Hack Club AI).
  - type: web
    name: renovo-ai-image
    runtime: python
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: HACKCLUB_AI_API_KEY
        sync: false

  # Primary Renovo GUI. The Node build target is required: the default build
  # output is a Cloudflare Worker, which this Render web service cannot run.
  - type: web
    name: renovo-ai-web
    runtime: node
    plan: free
    branch: main
    buildCommand: bun install && NITRO_PRESET=node-server bun run build
    startCommand: node .output/server/index.mjs
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: IDEAS_API_URL
        value: https://renovo-ai-ideas.onrender.com
      - key: IMAGE_API_URL
        value: https://renovo-ai-image.onrender.com
